<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<meta name="description" content="J.H. Lab 全球资讯观察站：每天精选中国与全球重要动态、前沿科研、公共政策与技术趋势。">
<title>全球资讯观察站 · J.H. Lab</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--surface:#111827;--line:#263146;--text:#e6ebf4;--muted:#92a3b9;--accent:#77dcff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse 80% 36% at 50% -5%,#123049 0%,transparent 78%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--text);line-height:1.72}a{color:inherit}a:hover{color:var(--accent)}
.wrap{width:min(1060px,calc(100% - 38px));margin:auto}.top{border-bottom:1px solid var(--line);background:#090d18cc;backdrop-filter:blur(18px);position:sticky;top:0;z-index:2}.top-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:13px;letter-spacing:.14em;font-weight:750;text-decoration:none}.nav{display:flex;gap:18px;font-size:13px;color:var(--muted)}.nav a{text-decoration:none}
.hero{padding:72px 0 32px}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:750}.hero h1{font-size:clamp(36px,7vw,66px);letter-spacing:-.06em;line-height:1.13;margin:16px 0}.hero p{color:var(--muted);max-width:640px;font-size:16px}.sub{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:26px}.chip,.btn{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12px;background:#162133;color:var(--muted)}.live{width:7px;height:7px;display:inline-block;border-radius:99px;background:#52d6b1;margin-right:7px}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:26px;margin-top:20px}.tabs{display:flex;flex-wrap:wrap;gap:7px}.btn{cursor:pointer;transition:all .2s}.btn[aria-pressed=true]{border-color:#52788a;background:#143345;color:#c4f1ff}.archive{background:#131d2c;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:12px;min-width:136px}
.status{color:var(--muted);font-size:13px;margin:19px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0 64px}.story{background:linear-gradient(145deg,#141e30,#101726);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;min-height:260px;transition:border-color .2s,transform .2s}.story:hover{border-color:#507d93;transform:translateY(-2px)}.meta{font-size:12px;color:#89a5b8;display:flex;align-items:center;justify-content:space-between;gap:8px}.category{color:#8ee2ff;font-weight:700}.story h2{font-size:21px;line-height:1.45;letter-spacing:-.02em;margin:16px 0 11px}.story p{font-size:14px;color:#b8c5d5;margin:0 0 12px}.reason{border-left:2px solid #4589a9;padding-left:12px;margin:12px 0!important}.reason b{color:#d5eaf4}.source{margin-top:auto;padding-top:12px;display:flex;gap:14px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.source a{color:#92e7ff;text-decoration:none;font-weight:700}.note{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding:20px 0 35px}.empty{grid-column:1/-1;border:1px dashed #405067;border-radius:18px;padding:40px;color:var(--muted);text-align:center}
@media(max-width:700px){.hero{padding-top:47px}.grid{grid-template-columns:1fr}.story{min-height:unset;padding:20px}.hero h1{font-size:41px}.nav{gap:8px}.story h2{font-size:19px}}
</style>
</head>
<body><header class="top"><div class="wrap top-inner"><a class="brand" href="/">J.H. LAB <span style="color:#77dcff">/ BRIEF</span></a><nav class="nav"><a href="/">返回主页 ↗</a><a href="#archive">历史简报</a></nav></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">GLOBAL INTELLIGENCE OBSERVATORY</div><h1>全球资讯<br>观察站<span style="color:#74daf8">.</span></h1><p>穿透日常信息流，连接中国与全球。每日追踪值得认真理解的公共议题、研究突破与技术变化；用中文呈现，附原始来源。</p><div class="sub"><span class="chip"><span class="live"></span>计划每日 09:00 更新 · 北京时间</span><span class="chip" id="headlineDate">等待首期发布</span><span class="chip" id="total">— 条精选</span></div></section>
<div class="toolbar" id="archive"><div class="tabs" id="tabs" aria-label="内容分类"></div><label style="font-size:12px;color:var(--muted)">期数 <select id="issues" class="archive" aria-label="选择历史日期"></select></label></div>
<p class="status" id="status" role="status">正在加载资讯…</p><section class="grid" id="stories" aria-live="polite"></section>
</main>
<footer class="wrap note">J.H. Lab · AI 辅助整理的公开资讯，摘要仅代表来源所述，并非独立事实核查。争议议题应核对多个来源。本站不保存访客个人数据。<br>所有报道版权归原发布方所有，点击原文链接查看完整内容。</footer>
<script>
(()=>{"use strict";
const root=document.getElementById("stories"),tabs=document.getElementById("tabs"),issues=document.getElementById("issues"),status=document.getElementById("status");
let current=[],category="全部",list=[];
const safeUrl=url=>{try{const u=new URL(url);return ["https:","http:"].includes(u.protocol)?u.href:null}catch{return null}};
const node=(tag,cls,value)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=value;return el};
const categories=()=>["全部",...new Set(current.map(x=>x.category||"其他"))];
function renderTabs(){tabs.replaceChildren();for(const name of categories()){const b=node("button","btn",name);b.type="button";b.setAttribute("aria-pressed",String(category===name));b.onclick=()=>{category=name;renderTabs();render()};tabs.append(b)}}
function render(){root.replaceChildren();const stories=current.filter(x=>category==="全部"||x.category===category);status.textContent="本期收录 "+current.length+" 条 · 当前显示 "+stories.length+" 条 · 重要事实请查证原始报道";if(!stories.length){root.append(node("div","empty","暂无对应资讯。请切换分类或日期。"));return}for(const x of stories){const card=node("article","story"),meta=node("div","meta"),cat=node("span","category",x.category||"全球观察"),when=node("span","",x.published||"时间未提供");meta.append(cat,when);card.append(meta,node("h2","",x.title_zh||"未命名资讯"),node("p","",x.summary_zh||""));if(x.why_zh){const p=node("p","reason");p.append(node("b","", "为什么值得关注　"),document.createTextNode(x.why_zh));card.append(p)}const foot=node("div","source");foot.append(node("span","",x.source||"原始来源"));const link=safeUrl(x.url);if(link){const a=node("a","","阅读原始报道 ↗");a.href=link;a.target="_blank";a.rel="noopener noreferrer";foot.append(a)}card.append(foot);root.append(card)}}
async function loadIssue(date){status.textContent="正在加载 "+date+"…";try{const resp=await fetch("./data/"+encodeURIComponent(date)+".json",{cache:"no-cache"});if(!resp.ok)throw Error("HTTP "+resp.status);const issue=await resp.json();current=Array.isArray(issue.items)?issue.items:[];category="全部";document.getElementById("headlineDate").textContent=issue.date||date;document.getElementById("total").textContent=current.length+" 条精选";renderTabs();render()}catch(e){current=[];root.replaceChildren(node("div","empty","这期内容暂时无法加载，请稍后重试。"));status.textContent="加载失败："+String(e.message||e)}}
async function init(){try{const r=await fetch("./data/index.json",{cache:"no-cache"});if(!r.ok)throw Error("暂无已发布的资讯");const index=await r.json();list=Array.isArray(index.dates)?index.dates.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)):[];const bjNow=new Date(Date.now()+8*3600000);const recent=[0,1].map(offset=>new Date(bjNow.getTime()-offset*86400000).toISOString().slice(0,10));for(const date of recent){if(list.includes(date))continue;try{const probe=await fetch("./data/"+date+".json",{cache:"no-store"});if(probe.ok){const data=await probe.json();if(data.date===date&&Array.isArray(data.items)&&data.items.length)list.push(date)}}catch{}}list=[...new Set(list)].sort().reverse();issues.replaceChildren();if(!list.length){root.append(node("div","empty","观察站已就绪，正在等待第一期日报发布。"));status.textContent="尚无归档数据。";return}for(const date of list){const o=node("option","",date);o.value=date;issues.append(o)}issues.onchange=()=>loadIssue(issues.value);await loadIssue(list[0])}catch(e){root.replaceChildren(node("div","empty","观察站页面已经就绪，首期数据发布后将自动显示。"));status.textContent=String(e.message||e)}}
init();
})();
</script></body></html>
