<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1226">
<title>云阙 · 浮岛 | J.H. LAB</title>
<meta name="description" content="程序化生成的 3D 浮空岛场景：云海、神社、樱花与瀑布，支持金色时刻与星夜切换。J.H. LAB 交互几何实验。">
<style>
  :root {
    --ink: #f3ead9;
    --ink-dim: rgba(243, 234, 217, 0.62);
    --gold: #e9c286;
    --panel: rgba(14, 18, 26, 0.34);
    --line: rgba(233, 194, 134, 0.34);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070b;
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  #view { display: block; width: 100%; height: 100%; touch-action: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui > * { pointer-events: none; }
  #ui button { pointer-events: auto; }

  .title-block {
    position: absolute;
    top: clamp(22px, 4.2vh, 54px);
    left: clamp(22px, 3.6vw, 64px);
    display: flex;
    gap: 18px;
    align-items: stretch;
  }
  .title-rule {
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--gold) 18%, var(--gold) 82%, transparent);
    opacity: 0.75;
  }
  .title-text .home-link {
    display: inline-block;
    pointer-events: auto;
    margin-bottom: 10px;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: rgba(233, 194, 134, 0.78);
    text-decoration: none;
    border-bottom: 1px solid rgba(233, 194, 134, 0.22);
    padding-bottom: 3px;
    transition: color 0.25s, border-color 0.25s;
  }
  .title-text .home-link:hover { color: var(--gold); border-color: rgba(233, 194, 134, 0.6); }
  .title-text h1 {
    margin: 0;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-size: clamp(30px, 4.4vw, 58px);
    font-weight: 600;
    letter-spacing: 0.18em;
    line-height: 1.05;
    color: #f6ecd9;
    text-shadow: 0 2px 26px rgba(0, 0, 0, 0.55);
  }
  .title-text .en {
    margin-top: 10px;
    font-size: clamp(9px, 0.85vw, 12px);
    letter-spacing: 0.42em;
    color: var(--gold);
    opacity: 0.9;
    text-transform: uppercase;
  }
  .title-text .zh-sub {
    margin-top: 8px;
    font-size: clamp(10px, 0.95vw, 13px);
    letter-spacing: 0.18em;
    color: var(--ink-dim);
  }

  .badge {
    position: absolute;
    top: clamp(24px, 4.4vh, 56px);
    right: clamp(22px, 3.6vw, 64px);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
    border: 1px solid rgba(243, 234, 217, 0.16);
    padding: 8px 12px;
    border-radius: 2px;
    background: rgba(10, 13, 18, 0.25);
    backdrop-filter: blur(6px);
  }

  .hint {
    position: absolute;
    left: clamp(22px, 3.6vw, 64px);
    bottom: clamp(20px, 3.4vh, 40px);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-dim);
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .hint .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: 0.7; }

  .hint-touch { display: none; }

  @media (pointer: coarse) {
    .hint { display: none; }
    .hint-touch {
      display: flex;
      position: absolute;
      left: 18px;
      bottom: calc(58px + env(safe-area-inset-bottom));
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ink-dim);
    }
  }

  .controls {
    position: absolute;
    right: clamp(22px, 3.6vw, 64px);
    bottom: calc(clamp(20px, 3.4vh, 40px) + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .controls button {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-dim);
    background: var(--panel);
    border: 1px solid rgba(243, 234, 217, 0.15);
    padding: 10px 16px;
    border-radius: 2px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: color 0.25s, border-color 0.25s, background 0.25s;
  }
  .controls button:hover { color: var(--ink); border-color: rgba(233, 194, 134, 0.55); }
  .controls button.active {
    color: #1a150d;
    border-color: transparent;
    background: linear-gradient(120deg, #efd29a, #d9aa66);
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(circle at 50% 42%, #121a26 0%, #05070b 68%);
    transition: opacity 0.9s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .ring {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(233, 194, 134, 0.18);
    border-top-color: var(--gold);
    animation: spin 1.1s linear infinite;
  }
  #loading .txt {
    font-size: 12px;
    letter-spacing: 0.4em;
    color: var(--ink-dim);
    padding-left: 0.4em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #err {
    display: none;
    position: fixed;
    left: 16px; right: 16px; top: 16px;
    z-index: 99;
    padding: 12px 16px;
    font: 12px/1.6 ui-monospace, Consolas, monospace;
    color: #ffd7d7;
    background: rgba(60, 12, 12, 0.88);
    border: 1px solid rgba(255, 120, 120, 0.5);
    white-space: pre-wrap;
  }
  #stats { display: none; }
  body.debug #stats {
    display: block;
    position: fixed;
    left: 16px; bottom: 70px;
    z-index: 30;
    max-width: 60vw;
    max-height: 40vh;
    overflow: auto;
    color: #cfe6ff;
    background: rgba(0, 0, 0, 0.6);
    font: 10px/1.5 ui-monospace, Consolas, monospace;
    padding: 8px 10px;
  }

  @media (max-width: 720px) {
    .title-text h1 { letter-spacing: 0.12em; }
    .hint { display: none; }
    .badge { display: none; }
    .controls { right: 16px; bottom: 16px; }
    .controls button { padding: 8px 12px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="loading"><div class="ring"></div><div class="txt">正在生成浮岛</div></div>
<div id="ui">
  <div class="title-block">
    <div class="title-rule"></div>
    <div class="title-text">
      <a class="home-link" href="/">← J.H. LAB · 返回主页</a>
      <h1>云阙</h1>
      <div class="en">Floating Isle · Cloud Keep</div>
      <div class="zh-sub">程序化生成 · 金色时刻 / 星夜</div>
    </div>
  </div>
  <div class="badge">THREE.JS · 100% PROCEDURAL</div>
  <div class="hint">
    <span>拖动旋转</span><span class="dot"></span>
    <span>滚轮缩放</span><span class="dot"></span>
    <span>空格 自动巡航</span>
  </div>
  <div class="hint-touch">单指旋转 · 双指缩放 · 横屏更佳</div>
  <div class="controls">
    <button id="btn-golden" class="active">金色时刻</button>
    <button id="btn-night">星夜</button>
    <button id="btn-auto">自动巡航</button>
  </div>
</div>
<div id="err"></div>
<pre id="stats"></pre>
