<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full-scene Pixel Optics Proof | J.H. LAB</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#18202d;font:16px/1.5 system-ui,sans-serif}header,main{max-width:960px;margin:auto;padding:16px}header{display:flex;justify-content:space-between}a{color:#1769d2}h1{font-size:clamp(24px,5vw,42px);margin:10px 0}p{margin:8px 0 14px}.frame{position:relative;background:white;border:1px solid #cad1db;border-radius:25px;overflow:hidden;height:min(65vh,550px);min-height:390px;touch-action:pan-y}.viewport{position:absolute;inset:0;overflow:auto}.viewport canvas{display:block;width:100%;height:auto}.glass{position:absolute;top:20px;left:12px;right:12px;height:76px;border:1px solid #ffffffd9;background:#e6eef3a6;border-radius:27px;box-shadow:0 12px 28px #1c25302b;backdrop-filter:blur(10px);overflow:hidden;pointer-events:none}.glass canvas{position:absolute;inset:0;width:100%;height:100%}.logo{position:relative;padding:18px 24px;font-weight:750;display:flex;justify-content:space-between}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.controls label{display:flex;align-items:center;gap:5px}button{border:1px solid #bbc5d1;border-radius:12px;padding:7px 14px;background:white}.status{font-size:14px}small{display:block;color:#566173;line-height:1.7;margin-top:16px}</style></head><body><header><a href="/">← J.H. LAB</a><span>Shared-renderer experiment</span></header><main><h1>全场景 RGB 像素折射验证</h1><p>滚动场景：蓝色链接、红色图像、真实站点照片、渐变、矢量图形与文字来自同一张完整 Canvas 画面；WebGL 从这张画面采样，不再通过猜测 DOM 元素颜色合成边缘。</p><div class="controls"><label><input type="checkbox" id="optics" checked> 启用边缘采样</label><label>折射 <input type="range" id="power" min="0" max="30" value="13"></label><button id="reset">返回顶部</button><span class="status" id="status" aria-live="polite">初始化中</span></div><div class="frame"><div class="viewport" id="viewport"><canvas id="scene" aria-label="可滚动的多色内容共享渲染场景"></canvas></div><div class="glass"><canvas id="rim" aria-hidden="true"></canvas><div class="logo"><span>J.H. LAB</span><span>EN　☼　☰</span></div></div></div><small>这是共享渲染场景的真实 RGB 纹理采样实验，不是对普通 DOM 网页的完整截图。此场景中的 Canvas、图片像素、渐变、SVG 等都已归入统一场景纹理；未来要用于实际主页，必须把相应内容接入共享渲染管线。WebGL 不可用时会保留 CSS 玻璃。</small></main>
<script>
(()=>{
const viewport=document.querySelector('#viewport'),scene=document.querySelector('#scene'),rim=document.querySelector('#rim'),status=document.querySelector('#status'),power=document.querySelector('#power'),optics=document.querySelector('#optics');
const context=scene.getContext('2d',{alpha:false});const gl=rim.getContext('webgl',{alpha:true,preserveDrawingBuffer:true,antialias:false});
const height=1850;let width=0;let textureDirty=true;let textureUploads=0;
const svg='<svg xmlns="http://www.w3.org/2000/svg" width="240" height="130"><circle cx="120" cy="65" r="54" fill="#18b85a"/><path d="M35 65h170M120 8v114" stroke="#fff" stroke-width="10"/></svg>';
const photo=new Image();photo.decoding='async';photo.src='/images/1.jpg';
const vector=new Image();vector.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
const red=new Image();red.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="130"><rect width="240" height="130" fill="#f02732"/><circle cx="80" cy="65" r="34" fill="#ffdc40"/></svg>');
function draw(){
 width=Math.max(260,Math.round(viewport.clientWidth));scene.width=width;scene.height=height;const c=context;
 c.fillStyle='#fff';c.fillRect(0,0,width,height);
 c.fillStyle='#16191f';c.font='800 44px system-ui';c.fillText('真实 RGB 折射',20,235,Math.max(100,width-40));
 c.fillStyle='#1769d2';c.font='700 29px system-ui';c.fillText('蓝色链接 / LINK',20,355,Math.max(100,width-40));
 if(red.complete&&red.naturalWidth)c.drawImage(red,20,430,Math.min(240,width-40),130);
 else{c.fillStyle='#f02732';c.fillRect(20,430,Math.min(240,width-40),130)}
 const gradient=c.createLinearGradient(10,620,width-10,620);gradient.addColorStop(0,'#e83d9c');gradient.addColorStop(.5,'#4965ec');gradient.addColorStop(1,'#02cdb3');c.fillStyle=gradient;c.fillRect(20,625,width-40,145);
 if(vector.complete&&vector.naturalWidth)c.drawImage(vector,20,810,Math.min(240,width-40),130);
 c.fillStyle='#171717';c.font='850 42px system-ui';c.fillText('一些有趣的尝试。',20,1080,Math.max(100,width-40));
 c.fillStyle='#73777d';c.font='24px system-ui';c.fillText('图片、颜色、渐变与 SVG',20,1200,Math.max(100,width-40));
 c.fillStyle='#f6a316';c.fillRect(20,1290,width-40,120);\n if(photo.complete&&photo.naturalWidth){const w=Math.min(width-40,540);const h=Math.min(280,w*photo.naturalHeight/photo.naturalWidth);c.drawImage(photo,20,1470,w,h)}\n else{c.fillStyle='#d6dce7';c.fillRect(20,1470,width-40,270)}\n textureDirty=true;
 render();
}
const vert='attribute vec2 p;varying vec2 uv;void main(){uv=(p+1.)*.5;gl_Position=vec4(p,0.,1.);}';
const frag='precision mediump float;varying vec2 uv;uniform sampler2D scene;uniform float sourceTop;uniform float sourceHeight;uniform float sceneHeight;uniform float strength;uniform float enabled;uniform float width;void main(){float edge=min(uv.y,1.-uv.y);float side=min(uv.x,1.-uv.x);float curve=pow(1.-smoothstep(0.,.18,edge),1.5);float shell=max(curve,pow(1.-smoothstep(0.,.04,side),1.5)*.4);float distortion=(.8-edge*1.9)*strength*.15;float sampleY=sourceTop+sourceHeight+(1.-uv.y)*65.+distortion;vec2 coord=vec2(clamp(uv.x+.003*strength*sin(uv.y*9.),0.,1.),clamp(1.-sampleY/sceneHeight,0.,1.));vec3 rgb=texture2D(scene,coord).rgb;float contrast=max(max(abs(rgb.r-.98),abs(rgb.g-.98)),abs(rgb.b-.98));float alpha=clamp(shell*contrast*.60*enabled,0.,.75);gl_FragColor=vec4(rgb,alpha);}';
function compile(type,source){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader}
let prog,texture;if(gl){try{prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vert));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error('link error');gl.useProgram(prog);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const a=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);}catch(e){prog=null}}
function render(){
 if(!prog){status.textContent='WebGL 不可用，使用 CSS 回退';return}
 const box=rim.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);rim.width=Math.round(box.width*scale);rim.height=Math.round(box.height*scale);
 gl.viewport(0,0,rim.width,rim.height);gl.useProgram(prog);gl.bindTexture(gl.TEXTURE_2D,texture);if(textureDirty){gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scene);textureDirty=false;textureUploads++;}
 gl.uniform1i(gl.getUniformLocation(prog,'scene'),0);
 gl.uniform1f(gl.getUniformLocation(prog,'sourceTop'),viewport.scrollTop+20);
 gl.uniform1f(gl.getUniformLocation(prog,'sourceHeight'),box.height);
 gl.uniform1f(gl.getUniformLocation(prog,'sceneHeight'),height);
 gl.uniform1f(gl.getUniformLocation(prog,'strength'),Number(power.value));
 gl.uniform1f(gl.getUniformLocation(prog,'enabled'),optics.checked?1:0);
 gl.uniform1f(gl.getUniformLocation(prog,'width'),width);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);status.textContent='WebGL · 全场景 RGB 纹理取样 · GPU 上传 '+textureUploads+' 次';
}
let pending=false;function schedule(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;render()})}}
viewport.addEventListener('scroll',schedule,{passive:true});power.addEventListener('input',schedule);optics.addEventListener('change',schedule);window.addEventListener('resize',draw);document.querySelector('#reset').addEventListener('click',()=>{viewport.scrollTop=0;schedule()});red.onload=draw;vector.onload=draw;photo.onload=draw;photo.onerror=draw;document.fonts?.ready.then(draw);draw();
})();
</script></body></html>
