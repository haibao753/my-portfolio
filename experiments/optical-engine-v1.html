<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optical Engine V1 | J.H. LAB</title><style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;margin:0;padding:24px;max-width:940px;margin-inline:auto;color:#171d25;background:#f5f7fa}h1{line-height:1.2}.stage{position:relative;margin-top:20px;background:white;padding:34px 12px;border:1px solid #ccd3db;border-radius:26px;overflow:hidden}.stage canvas{display:block;width:100%;height:auto}.capsule{position:absolute;top:38%;left:3%;width:94%;height:23%;border:1px solid rgba(255,255,255,.8);border-radius:999px;overflow:hidden;box-shadow:0 15px 26px #36495b30;background:#e8f0ff35}.capsule canvas{width:100%;height:100%}.capsule span{position:absolute;top:38%;left:5%;font-weight:700;color:#0d1624;text-shadow:0 1px white;pointer-events:none}label{display:inline-flex;gap:8px;margin:12px;align-items:center}input[type=range]{width:140px}a{color:#1769d2}small{color:#596477;display:block;margin:12px 0}</style><a href="/">← 首页</a><h1>双界面折射 · 像素位移标定</h1><p>共享 Canvas 真实 RGB 场景经过 WebGL Shader 产生空间位移。调整强度，对比彩色棋盘网格、真实站点照片及圆角边缘；这不是对网页 DOM 的截图。</p><label>折射强度 <input id="strength" type="range" min="0" max="4" value="2" step=".25"></label><label><input id="enabled" type="checkbox" checked>启用折射</label><label><input id="fresnel" type="checkbox" checked>菲涅耳高光</label><output id="status">初始化中</output><div class="stage"><canvas id="reference" width="900" height="650" aria-label="彩色棋盘与参考场景"></canvas><div class="capsule"><canvas id="glass" aria-label="WebGL 曲面折射像素输出"></canvas><span>J.H. LAB</span></div></div><small>实验只采样共享渲染纹理内的内容；实际主页的全部 DOM 像素还未接入。WebGL 不可用时实验会明确显示。</small><script type="module">
import {setup} from '/assets/optical-engine.js';
const ref=document.querySelector('#reference'),view=document.querySelector('#glass'),ctx=ref.getContext('2d'),strength=document.querySelector('#strength'),enabled=document.querySelector('#enabled'),fresnel=document.querySelector('#fresnel'),status=document.querySelector('#status');
const gl=view.getContext('webgl',{alpha:true,preserveDrawingBuffer:true});let render;
if(gl){try{render=setup(gl)}catch(e){status.textContent='Shader 初始化失败：'+e.message}}
const photo=new Image();photo.decoding='async';photo.src='/images/2.jpg';photo.onload=()=>{grid();requestAnimationFrame(paint)};
function grid(){
 const w=ref.width,h=ref.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 for(let y=0;y<h;y+=40)for(let x=0;x<w;x+=40){ctx.fillStyle=(x/40+y/40)%2?'#eef2f6':'#d2d9e5';ctx.fillRect(x,y,40,40)}
 for(let x=0;x<=w;x+=40){ctx.fillStyle='#355170';ctx.fillRect(x,0,1,h)}
 for(let y=0;y<=h;y+=40){ctx.fillStyle='#355170';ctx.fillRect(0,y,w,1)}
 const colors=['#e83943','#1d68ea','#08b98b','#f49b20','#843be2'];colors.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(40+i*160,250,140,150)});
 ctx.fillStyle='#111827';ctx.font='bold 55px sans-serif';ctx.fillText('真实像素 · RGB',70,180);
 ctx.fillStyle='#0865c8';ctx.font='bold 37px sans-serif';ctx.fillText('BLUE LINK →',65,510);
 if(photo.complete&&photo.naturalWidth){ctx.drawImage(photo,520,50,320,175);ref.dataset.realImage='loaded'}
 const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'#ef335a');g.addColorStop(.5,'#2c65e9');g.addColorStop(1,'#14d5b1');ctx.fillStyle=g;ctx.fillRect(0,560,w,65);
}
function paint(){
 if(!render)return;const stage=view.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);view.width=Math.max(1,Math.round(stage.width*d));view.height=Math.max(1,Math.round(stage.height*d));
 const scene=document.createElement('canvas');scene.width=view.width;scene.height=view.height;const cc=scene.getContext('2d');
 const capsule=document.querySelector('.capsule').getBoundingClientRect(),base=ref.getBoundingClientRect();
 const sx=ref.width/base.width,sy=ref.height/base.height;
 cc.drawImage(ref,(capsule.left-base.left)*sx,(capsule.top-base.top)*sy,capsule.width*sx,capsule.height*sy,0,0,scene.width,scene.height);
 render(scene,{strength:Number(strength.value),optical:enabled.checked?1:0,reflectivity:fresnel.checked?1:0});
 status.textContent='WebGL 运行中 · '+view.width+' × '+view.height;
}
grid();const redraw=()=>requestAnimationFrame(paint);[strength,enabled,fresnel].forEach(x=>x.addEventListener('input',redraw));addEventListener('resize',redraw);redraw();
</script></html>
