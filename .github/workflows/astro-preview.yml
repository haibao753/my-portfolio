name: Astro Refactor Validation
on:
  push:
    branches: [refactor/astro-foundation]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/astro-preview.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check preserved routes
        run: node scripts/verify-build.mjs
      - name: Install browser for visual acceptance
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Upload visual screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
