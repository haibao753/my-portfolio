name: Astro Refactor Validation
on:
  push:
    branches: [main, refactor/astro-foundation]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "experiments/**"
      - "tests/**"
      - "playwright.config.ts"
      - "wrangler*.jsonc"
      - "assets/**"
      - "docs/liquid-glass-3-acceptance.md"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/astro-preview.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check public Bilibili video metadata
        run: |
          python3 - <<'PY'
          import json,urllib.request
          for name,bvid in [('mobius','BV1BDpB6wEiJ'),('group','BV1LTa562Ehz'),('evo','BV1jjWA6aECU'),('fourier','BV1s2a16nEbr')]:
              req=urllib.request.Request('https://api.bilibili.com/x/web-interface/view?bvid='+bvid,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'})
              try:
                  with urllib.request.urlopen(req,timeout=8) as resp: data=json.load(resp)
                  v=data.get('data') or {}
                  print('BILIBILI_META',name,'code',data.get('code'),'aid',v.get('aid'),'cid',v.get('cid'),'rights',v.get('rights'))
              except Exception as exc: print('BILIBILI_META',name,'error',type(exc).__name__)
          PY
      - name: Type check
        run: npm run check
      - name: Guard experimental default Worker deployment
        run: node --test tests/build-guard.test.mjs
      - name: Build
        run: npm run build:cloudflare
      - name: Check preserved routes
        run: node scripts/verify-build.mjs
      - name: Validate isolated Workers preview bundle (dry run)
        run: npm run deploy:preview:dry-run
      - name: Validate branch Preview assets configuration (dry run only)
        run: npx wrangler deploy --config wrangler.branch-preview.jsonc --dry-run
      - name: Validate default production build and assets configuration (dry run only)
        env:
          WORKERS_CI_BRANCH: main
        run: npx wrangler deploy --dry-run
      - name: Archive deployable static site
        uses: actions/upload-artifact@v4
        with:
          name: astro-preview-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Install browser for visual acceptance
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Upload visual screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - name: Upload complete deployable staging site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astro-refactor-site
          path: dist/
          retention-days: 14
